name: Apify B2B Super-Actors Heartbeat & Metadata Health Check

on:
  schedule:
    # Weekly on Mondays at 06:00 UTC (Permanently Zero-Cost Public Metadata Health Check)
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  heartbeat:
    name: Probe Actor Availability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Metadata Health Checks
        run: |
          python -c "
          import urllib.request, json, sys

          actors = [
              'catalog-feed-normalizer',
              'website-health-checker',
              'indian-public-tender-parser',
              'openrouter-mcp-registry',
              'store-catalog-redirect-extractor',
              'domain-security-super-auditor'
          ]

          print('=== Apify B2B Super-Actors Public Metadata Health Check ===')
          print('Execution Mode: PERMANENTLY_METADATA_ONLY (Cost: $0.00, Auth: None)\n')

          success_count = 0
          for slug in actors:
              base_url = f'https://api.apify.com/v2/acts/deepaksheoran172~{slug}'
              req = urllib.request.Request(
                  base_url,
                  headers={'User-Agent': 'ApifyHeartbeatMonitor/3.0'}
              )

              try:
                  with urllib.request.urlopen(req, timeout=90) as resp:
                      if resp.status != 200:
                          print(f'[-] {slug}: HTTP_{resp.status}_ERROR')
                          continue

                      data = json.loads(resp.read().decode('utf-8'))
                      actor_name = data.get('data', {}).get('name', '')
                      if actor_name == slug:
                          print(f'[+] {slug}: METADATA_ONLINE (Cost: $0.00, Execution: SKIPPED)')
                          success_count += 1
                      else:
                          print(f'[-] {slug}: UNEXPECTED_METADATA_NAME (Got: {actor_name})')
              except Exception as e:
                  print(f'[-] {slug} check failed: {e}')

          print(f'\nSummary: {success_count}/{len(actors)} verified online.')
          if success_count < len(actors):
              sys.exit(1)
          "

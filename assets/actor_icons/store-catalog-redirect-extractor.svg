<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad_store-catalog-redirect-extractor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow_store-catalog-redirect-extractor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Gradient Container -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="url(#grad_store-catalog-redirect-extractor)" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
  
  <!-- Glassmorphic Inner Card -->
  <rect x="60" y="60" width="392" height="300" rx="45" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Subtitle Grid Elements -->
  <line x1="60" y1="210" x2="452" y2="210" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <line x1="256" y1="60" x2="256" y2="360" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Central Symbol Vector Group -->
  <g transform="translate(256, 210)" text-anchor="middle" dominant-baseline="middle">
    <!-- Glowing Halo -->
    <circle cx="0" cy="0" r="75" fill="#34D399" opacity="0.15" filter="url(#glow_store-catalog-redirect-extractor)" />
    <circle cx="0" cy="0" r="50" fill="rgba(255,255,255,0.12)" stroke="#34D399" stroke-width="3" />
    <!-- Dynamic Emblem Badge -->
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">301 SEO</text>
  </g>

  <!-- Bottom Pill Badge -->
  <g transform="translate(256, 435)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="rgba(0,0,0,0.75)" stroke="#34D399" stroke-width="2.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">301 SEO</text>
  </g>
</svg>
